<style>
        .comic-bg {
            background-color: #1E40C4;
            background-image: radial-gradient(#0B1440 15%, transparent 16%);
            background-size: 8px 8px;
        }
        .comic-border {
            border: 4px solid #0B1440;
        }
        .comic-shadow {
            box-shadow: 4px 4px 0px 0px #0A0E27;
        }
        .web-line {
            position: absolute;
            height: 1px;
            background-color: white;
            top: 50%;
            left: 0;
            width: 0;
            transition: width 0.3s ease-out;
            transform-origin: left;
            opacity: 0.5;
            pointer-events: none;
        }
        .nav-link:hover .web-line {
            width: 100%;
        }
        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 35, 27, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(229, 35, 27, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 35, 27, 0); }
        }
        .live-dot {
            animation: pulse-dot 2s infinite;
        }

<script>
        // Simple script to handle navbar background darkening on scroll
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar').firstElementChild;
            if (window.scrollY > 50) {
                nav.style.backgroundColor = '#0f2063'; // Darker blue
            } else {
                nav.style.backgroundColor = '#1E40C4'; // Original blue
            }
        });
    </script>
